name: Lua Lint

on:
  push:
    paths:
      - "**/*.lua"
      - ".luacheckrc"
      - ".github/workflows/lua-lint.yml"
  pull_request:
    paths:
      - "**/*.lua"
      - ".luacheckrc"
      - ".github/workflows/lua-lint.yml"

jobs:
  luacheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Lua
        uses: leafo/gh-actions-lua@v11
        with:
          luaVersion: "5.4"
      - name: Setup LuaRocks
        uses: leafo/gh-actions-luarocks@v5
      - name: Install luacheck
        run: luarocks install luacheck
      - name: Run luacheck
        run: luacheck src
