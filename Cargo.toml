[package]
name = "kkc"
version = "0.1.0"
edition = "2024"
description = "KKC — Ketchup Killers Commander, a Norton Commander clone in Rust"
authors = ["RedBug26"]

[[bin]]
name = "kkc"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
directories = "5"
anyhow = "1"
walkdir = "2"
chrono = { version = "0.4", features = ["serde"] }
unicode-width = "0.2"
open = "5"
imap = "2.4"
native-tls = "0.2"

[profile.release]
opt-level = 3
strip = true
lto = true
