[package]
name = "kkc"
version = "0.1.18"
edition = "2024"
description = "KKC — Ketchup Killers Commander, a Norton Commander clone in Rust"
authors = ["RedBug26"]

[[bin]]
name = "kkc"
path = "src/main.rs"

[dependencies]
ratatui = { version = "0.29", features = ["unstable-rendered-line-info"] }
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
directories = "5"
anyhow = "1"
walkdir = "2"
chrono = { version = "0.4", features = ["serde"] }
unicode-width = "0.2"
open = "5"
base64 = "0.13"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }
jpeg-decoder = "0.3"
font8x8 = { version = "0.2", features = ["unicode"] }
mlua = { version = "0.10", features = ["lua54", "vendored", "error-send"] }
zip = { version = "8.5.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }
ureq = { version = "2.10", default-features = false, features = ["native-tls"] }
pavao = { version = "0.2", optional = true }
libc = "0.2"
abi_stable = "0.11.3"
kkc-plugin-api = { path = "crates/kkc-plugin-api" }
arboard = "3"
unarc-rs = "0.6.1"
rodio = { version = "0.22", default-features = false, features = ["playback", "wav", "flac", "mp3"] }
rustfft = "6.2"
xmrs = { version = "0.11.0", default-features = false, features = ["std", "import_mod", "import_xm", "import_s3m", "import_it"] }
xmrsplayer = { version = "0.11.1", default-features = false, features = ["std", "import_mod", "import_xm", "import_s3m", "import_it"] }
delharc = "0.6"

[features]
smb = ["dep:pavao"]

[profile.release]
opt-level = "z"
strip = true
lto = true
codegen-units = 1
panic = "abort"
