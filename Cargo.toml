[package]
name = "kkc"
version = "0.1.18"
edition = "2024"
description = "KKC — Ketchup Killers Commander, a Norton Commander clone in Rust"
authors = ["RedBug26"]

[[bin]]
name = "kkc"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
directories = "5"
anyhow = "1"
walkdir = "2"
chrono = { version = "0.4", features = ["serde"] }
unicode-width = "0.2"
open = "5"
base64 = "0.13"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }
font8x8 = { version = "0.2", features = ["unicode"] }
mlua = { version = "0.10", features = ["lua54", "vendored", "error-send"] }
zip = { version = "8.5.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }
ureq = { version = "2.10", default-features = false, features = ["native-tls"] }
pavao = { version = "0.2", optional = true }
libc = "0.2"
abi_stable = "0.11.3"
kkc-plugin-api = { path = "crates/kkc-plugin-api" }
arboard = "3"

[features]
smb = ["dep:pavao"]

[profile.release]
opt-level = 3
strip = true
lto = true
