name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  # ─── Build binaries ────────────────────────────────────────────────────────

  build-linux:
    name: Build Linux x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install OpenSSL headers
        run: sudo apt-get install -y pkg-config libssl-dev

      - name: Build
        run: cargo build --release

      - name: Package
        run: tar czf kkc-linux-x86_64.tar.gz -C target/release kkc

      - uses: actions/upload-artifact@v4
        with:
          name: kkc-linux-x86_64
          path: kkc-linux-x86_64.tar.gz

  build-macos-arm64:
    name: Build macOS arm64
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release

      - name: Package
        run: tar czf kkc-macos-arm64.tar.gz -C target/release kkc

      - uses: actions/upload-artifact@v4
        with:
          name: kkc-macos-arm64
          path: kkc-macos-arm64.tar.gz

  build-macos-x86_64:
    name: Build macOS x86_64
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release

      - name: Package
        run: tar czf kkc-macos-x86_64.tar.gz -C target/release kkc

      - uses: actions/upload-artifact@v4
        with:
          name: kkc-macos-x86_64
          path: kkc-macos-x86_64.tar.gz

  # ─── Create release & update formula ──────────────────────────────────────

  release:
    name: Publish release
    needs: [build-linux, build-macos-arm64, build-macos-x86_64]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Flatten artifacts
        run: find artifacts/ -name '*.tar.gz' -exec mv {} . \;

      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Compute SHA256 sums
        id: sha
        run: |
          echo "arm64=$(sha256sum kkc-macos-arm64.tar.gz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "x86_64=$(sha256sum kkc-macos-x86_64.tar.gz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "linux=$(sha256sum kkc-linux-x86_64.tar.gz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Regenerate Homebrew formula
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SHA_ARM64: ${{ steps.sha.outputs.arm64 }}
          SHA_X86_64: ${{ steps.sha.outputs.x86_64 }}
          SHA_LINUX: ${{ steps.sha.outputs.linux }}
        run: |
          cat > Formula/kkc.rb << RUBY
          class Kkc < Formula
            desc "Dual-panel file manager inspired by Norton Commander, written in Rust"
            homepage "https://github.com/redbug26/kkc-rust"
            version "${VERSION}"
            license "MIT"

            on_macos do
              if Hardware::CPU.arm?
                url "https://github.com/redbug26/kkc-rust/releases/download/v${VERSION}/kkc-macos-arm64.tar.gz"
                sha256 "${SHA_ARM64}"
              else
                url "https://github.com/redbug26/kkc-rust/releases/download/v${VERSION}/kkc-macos-x86_64.tar.gz"
                sha256 "${SHA_X86_64}"
              end
            end

            on_linux do
              url "https://github.com/redbug26/kkc-rust/releases/download/v${VERSION}/kkc-linux-x86_64.tar.gz"
              sha256 "${SHA_LINUX}"
            end

            # Build from source with: brew install --HEAD redbug26/kkc-rust/kkc
            head do
              url "https://github.com/redbug26/kkc-rust.git", branch: "main"
              depends_on "rust" => :build
            end

            def install
              if build.head?
                system "cargo", "install", *std_cargo_args
              else
                bin.install "kkc"
              end
            end

            test do
              assert_predicate bin/"kkc", :exist?
            end
          end
          RUBY
          # Remove leading spaces introduced by the heredoc indentation
          sed -i 's/^          //' Formula/kkc.rb

      - name: Commit updated formula
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/kkc.rb
          git commit -m "chore: update formula to v${{ steps.version.outputs.version }}"
          git push origin HEAD:main

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            kkc-macos-arm64.tar.gz
            kkc-macos-x86_64.tar.gz
            kkc-linux-x86_64.tar.gz
