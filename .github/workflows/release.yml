name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.1.14)'
        required: true
        default: 'v0.1.14'

env:
  CARGO_TERM_COLOR: always

jobs:
  # ─── Build binaries ────────────────────────────────────────────────────────

  build-linux:
    name: Build Linux x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install OpenSSL headers
        run: sudo apt-get install -y pkg-config libssl-dev libsmbclient-dev

      - name: Build
        run: cargo build --release --features smb

      - name: Package
        run: tar czf kkc-linux-x86_64.tar.gz -C target/release kkc

      - uses: actions/upload-artifact@v4
        with:
          name: kkc-linux-x86_64
          path: kkc-linux-x86_64.tar.gz

  build-macos-arm64:
    name: Build macOS arm64
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install samba (libsmbclient)
        run: brew install samba

      - name: Build
        run: PKG_CONFIG_PATH="$(brew --prefix samba)/lib/pkgconfig" cargo build --release --features smb

      - name: Package
        run: tar czf kkc-macos-arm64.tar.gz -C target/release kkc

      - uses: actions/upload-artifact@v4
        with:
          name: kkc-macos-arm64
          path: kkc-macos-arm64.tar.gz

  build-macos-x86_64:
    name: Build macOS x86_64
    runs-on: macos-13
    if: false   # disabled: macos-13 runners have very long queue times on free tier
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release

      - name: Package
        run: tar czf kkc-macos-x86_64.tar.gz -C target/release kkc

      - uses: actions/upload-artifact@v4
        with:
          name: kkc-macos-x86_64
          path: kkc-macos-x86_64.tar.gz

  # ─── Create release & update formula ──────────────────────────────────────

  release:
    name: Publish release
    needs: [build-linux, build-macos-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Flatten artifacts
        run: find artifacts/ -name '*.tar.gz' -exec mv {} . \;

      - name: Get version from tag
        id: version
        run: |
          REF="${{ github.event.inputs.tag || github.ref_name }}"
          echo "version=${REF#v}" >> "$GITHUB_OUTPUT"
          echo "tag=${REF}" >> "$GITHUB_OUTPUT"

      - name: Compute SHA256 sums
        id: sha
        run: |
          echo "arm64=$(sha256sum kkc-macos-arm64.tar.gz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "linux=$(sha256sum kkc-linux-x86_64.tar.gz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Regenerate Homebrew formula
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SHA_ARM64: ${{ steps.sha.outputs.arm64 }}
          SHA_LINUX: ${{ steps.sha.outputs.linux }}
        run: python3 .github/scripts/update_formula.py

      - name: Commit updated formula
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/kkc.rb
          git commit -m "chore: update formula to v${{ steps.version.outputs.version }}"
          git push origin HEAD:main

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: |
            kkc-macos-arm64.tar.gz
            kkc-linux-x86_64.tar.gz
